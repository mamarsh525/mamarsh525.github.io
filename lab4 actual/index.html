<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <h1 class="mb-4">Sign Up Form</h1>

        <fieldset class="card p-4 shadow-sm">
            <legend class="fw-bold">Sign Up</legend>

            <div class="mb-3">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Zip Code</label>
                <input id="zipCode" type="text" class="form-control">
                <span id="badZip" class="text-danger small"></span>
            </div>

            <div class="mb-1">
                <span class="fw-semibold">City:</span> <span id="city"></span>
            </div>
            <div class="mb-1">
                <span class="fw-semibold">Latitude:</span> <span id="latitude"></span>
            </div>
            <div class="mb-3">
                <span class="fw-semibold">Longitude:</span> <span id="longitude"></span>
            </div>

            <div class="mb-3">
                <label class="form-label">State</label>
                <select id="state" class="form-select"></select>
            </div>

            <div class="mb-3">
                <label class="form-label">Select a County</label>
                <select id="county" class="form-select"></select>
            </div>

            <div class="mb-3">
                <label class="form-label">Desired Username</label>
                <input id="usernameTextBox" type="text" class="form-control">
                <span id="usernameAvailability" class="small"></span>
                <div id="usernameError" class="small"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="password" type="password" class="form-control">
                <span id="suggestedPassword" class="text-muted small"></span>
                <div id="signupError" class="small"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Type Password Again</label>
                <input id="retypePassword" type="password" class="form-control">
                <div id="matchingError" class="small"></div>
            </div>

            <button id="submitBtn" type="submit" class="btn btn-primary w-100">Sign up!</button>

            <div id="usernameFinalError" class="small mt-2"></div>
            <div id="passwordFinalLengthError" class="small"></div>
            <div id="passwordFinalError" class="small"></div>
            <div id="successMessage" class="small"></div>
        </fieldset>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
